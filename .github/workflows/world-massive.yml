name: Repair and integrate WORLD patch
on:
  push:
    branches: [main]
    paths:
      - 'world-massive.js'
      - '.github/workflows/world-massive.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair and validate WORLD patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('game.html').read_text(encoding='utf-8')
          s = s.replace("]},{{t:", "]},{t:")
          tag = '<script src="world-massive.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          Path('game.html').write_text(s, encoding='utf-8')
          start = s.index('const PATCH=')
          end = s.index('\n(function(){', start)
          Path('/tmp/patch-notes.js').write_text(s[start:end], encoding='utf-8')
          PY
          node --check /tmp/patch-notes.js
          node --check world-massive.js
      - name: Commit repaired game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix WORLD patch notes syntax"
            git push origin main
          fi
