name: Integrate WORLD Massive patch
on:
  push:
    branches: [main]
    paths:
      - 'world-massive.js'
      - '.github/workflows/world-massive.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach world systems to the game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="world-massive.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('game.html has no closing body tag')
              s = s.replace('</body>', tag + '\n</body>', 1)
          old = "const PATCH={n:'Бета 2.1B',name:'Рассказчики и монеты'"
          new = "const PATCH={n:'Бета 2.2',name:'WORLD — Живой мир'"
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integrated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate WORLD Massive patch into game"
            git push origin main
          fi
