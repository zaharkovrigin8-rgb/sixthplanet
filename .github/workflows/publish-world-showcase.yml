name: Publish WORLD 2.2 showcase and trailer
on:
  push:
    branches: [main]
    paths:
      - 'world-update.html'
      - 'tools/build_world_video.py'
      - '.github/workflows/publish-world-showcase.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: world-showcase
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak python3-pil fonts-dejavu-core
      - name: Render narrated video and subtitles
        run: python3 tools/build_world_video.py
      - name: Remove obsolete homepage announcement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, count = re.subn(r'<a\\b[^>]*id=["\\']sp-world-showcase-link["\\'][^>]*>.*?</a>', '', s, count=1, flags=re.I | re.S)
          p.write_text(s, encoding='utf-8')
          print(f'Removed {count} obsolete announcement banner(s)')
          PY
      - name: Validate video and subtitle outputs
        run: |
          test -s world-massive-trailer.mp4
          test -s world-massive.ru.vtt
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 world-massive-trailer.mp4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
